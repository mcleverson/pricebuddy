services:

    app:
        build:
            context: .
            dockerfile: docker/php.dockerfile
        image: jez500/pricebuddy:latest
        ports:
            - 8080:80
        extra_hosts:
            - "host.docker.internal:host-gateway"   # AI provider (OmniRoute) running on the host
        volumes:
            - storage:/app/storage
            - ./.env:/app/.env
        environment:
            DB_HOST: database                       # Name of the database service
            DB_USERNAME: pricebuddy                 # Should match the MYSQL_USER in the database service
            DB_PASSWORD: pric3buddy                 # Should match the MYSQL_PASSWORD in the database service
            DB_DATABASE: pricebuddy                 # Should match the MYSQL_DATABASE in the database service
            APP_USER_EMAIL: admin@example.com       # Only used for seeding the database
            APP_USER_PASSWORD: admin                # Only used for seeding the database
            SCRAPER_BASE_URL: http://scraper:3000   # Url to Name of the scrapper service
            AFFILIATE_ENABLED: 'true'               # See https://pricebuddy.jez.me/support-project.html
        depends_on:
            database:
                condition: service_healthy
        networks:
            - default
            - hermes_app

    database:
        image: mysql:8.2
        environment:
            MYSQL_DATABASE: pricebuddy
            MYSQL_USER: pricebuddy
            MYSQL_PASSWORD: pric3buddy
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - database:/var/lib/mysql
        networks:
            - default
        healthcheck:
            test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 1m

    scraper:
        build:
            context: ./docker/scraper
            dockerfile: Dockerfile
        image: pricebuddy-scraper:latest
        pull_policy: build
        networks:
            - default
        ports:
            - 3030:3000 # Optional, if you want to access the scrapper api from the host machine

    hermes:
        build:
            context: .
            dockerfile: docker/hermes/Dockerfile
        image: pricebuddy-hermes:latest
        restart: unless-stopped
        # Temporário: permite que localhost no .env alcance o OmniRoute no host.
        # Substituir por uma rede privada com o serviço omniroute no Compose.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PRICEBUDDY_API_BASE_URL: http://app/api
            PRICEBUDDY_API_TOKEN: ${PRICEBUDDY_API_TOKEN:-}
            HERMES_ALLOWED_HOSTS: ${HERMES_ALLOWED_HOSTS:-}
            HERMES_HTTP_PROXY: ${HERMES_HTTP_PROXY:-}
            HERMES_DEFAULT_TAG: ${HERMES_DEFAULT_TAG:-}
            HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:-}
            HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY:-}
            HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-}
            HERMES_LLM_ENABLE_THINKING: ${HERMES_LLM_ENABLE_THINKING:-true}
            HERMES_LLM_REQUEST_TIMEOUT_SECONDS: ${HERMES_LLM_REQUEST_TIMEOUT_SECONDS:-120}
            HERMES_LLM_MAX_OUTPUT_TOKENS: ${HERMES_LLM_MAX_OUTPUT_TOKENS:-4096}
            HERMES_LLM_PAGE_SEGMENT_CHARS: ${HERMES_LLM_PAGE_SEGMENT_CHARS:-12000}
            HERMES_MAX_PAGES: ${HERMES_MAX_PAGES:-15}
            HERMES_RUN_TIMEOUT_SECONDS: ${HERMES_RUN_TIMEOUT_SECONDS:-600}
            HERMES_2CAPTCHA_API_KEY: ${HERMES_2CAPTCHA_API_KEY:-}
            HERMES_2CAPTCHA_PROXY: ${HERMES_2CAPTCHA_PROXY:-}
            HERMES_2CAPTCHA_TIMEOUT: ${HERMES_2CAPTCHA_TIMEOUT:-180}
            HERMES_2CAPTCHA_MAX_RETRIES: ${HERMES_2CAPTCHA_MAX_RETRIES:-2}
        depends_on:
            app:
                condition: service_started
        volumes:
            - hermes_firefox_profile:/home/hermes/.mozilla/firefox/pricebuddy-hermes
        networks:
            - hermes_app
        expose:
            - 8000
        healthcheck:
            test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')" ]
            interval: 10s
            timeout: 5s
            retries: 3

    intelligence:
        build:
            context: .
            dockerfile: intelligence/Dockerfile
        image: pricebuddy-intelligence:latest
        restart: unless-stopped
        environment:
            PRICEBUDDY_API_BASE_URL: http://app/api
            # API key created in PriceBuddy > API Keys with: product pagination,
            # product detail and "Read the Intelligence settings".
            INTELLIGENCE_PRICEBUDDY_API_TOKEN: ${INTELLIGENCE_PRICEBUDDY_API_TOKEN:-}
            HERMES_URL: http://hermes:8000
            TZ: America/Sao_Paulo
        depends_on:
            app:
                condition: service_started
            hermes:
                condition: service_started
        volumes:
            - intelligence_data:/data
        networks:
            - hermes_app
        expose:
            - 8100

    hermes_visual:
        profiles: [ "visual" ]
        build:
            context: .
            dockerfile: docker/hermes/Dockerfile
        image: pricebuddy-hermes:latest
        shm_size: "1gb"
        environment:
            PRICEBUDDY_API_TOKEN: ${PRICEBUDDY_API_TOKEN:-}
            HERMES_ALLOWED_HOSTS: ${HERMES_ALLOWED_HOSTS:-}
            HERMES_HTTP_PROXY: ${HERMES_HTTP_PROXY:-}
            HERMES_DEFAULT_TAG: ${HERMES_DEFAULT_TAG:-}
        depends_on:
            app:
                condition: service_started
        volumes:
            - hermes_firefox_profile:/home/hermes/.mozilla/firefox/pricebuddy-hermes
        networks:
            - hermes_app
        ports:
            - "127.0.0.1:7900:7900"
        stdin_open: true
        tty: true
        entrypoint: [ "bash", "/opt/hermes/run-visual-diagnose.sh" ]
    hermes_agent:
        profiles: [ "agent" ]
        build:
            context: .
            dockerfile: docker/hermes/Dockerfile
        image: pricebuddy-hermes:latest
        shm_size: "1gb"
        # Temporário: permite que localhost no .env alcance o OmniRoute no host.
        # Substituir por uma rede privada com o serviço omniroute no Compose.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PRICEBUDDY_API_BASE_URL: http://app/api
            PRICEBUDDY_API_TOKEN: ${PRICEBUDDY_API_TOKEN:-}
            HERMES_STORE_ID: ${HERMES_STORE_ID:-}
            HERMES_MIN_DISCOUNT_PERCENTAGE: ${HERMES_MIN_DISCOUNT_PERCENTAGE:-20}
            HERMES_ALLOWED_HOSTS: ${HERMES_ALLOWED_HOSTS:-}
            HERMES_HTTP_PROXY: ${HERMES_HTTP_PROXY:-}
            HERMES_DEFAULT_TAG: ${HERMES_DEFAULT_TAG:-}
            HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:-}
            HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY:-}
            HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-}
            HERMES_LLM_ENABLE_THINKING: ${HERMES_LLM_ENABLE_THINKING:-true}
            HERMES_LLM_REQUEST_TIMEOUT_SECONDS: ${HERMES_LLM_REQUEST_TIMEOUT_SECONDS:-120}
            HERMES_LLM_MAX_OUTPUT_TOKENS: ${HERMES_LLM_MAX_OUTPUT_TOKENS:-4096}
            HERMES_LLM_PAGE_SEGMENT_CHARS: ${HERMES_LLM_PAGE_SEGMENT_CHARS:-12000}
            HERMES_MAX_PAGES: ${HERMES_MAX_PAGES:-15}
            HERMES_MIN_PRODUCTS: ${HERMES_MIN_PRODUCTS:-10}
            HERMES_RUN_TIMEOUT_SECONDS: ${HERMES_RUN_TIMEOUT_SECONDS:-600}
            HERMES_2CAPTCHA_API_KEY: ${HERMES_2CAPTCHA_API_KEY:-}
            HERMES_2CAPTCHA_PROXY: ${HERMES_2CAPTCHA_PROXY:-}
            HERMES_2CAPTCHA_TIMEOUT: ${HERMES_2CAPTCHA_TIMEOUT:-180}
            HERMES_2CAPTCHA_MAX_RETRIES: ${HERMES_2CAPTCHA_MAX_RETRIES:-2}
        depends_on:
            app:
                condition: service_started
        volumes:
            - hermes_firefox_profile:/home/hermes/.mozilla/firefox/pricebuddy-hermes
        networks:
            - hermes_app
        stdin_open: true
        tty: true
        entrypoint: [ "bash", "/opt/hermes/run-agent-headless.sh" ]

    hermes_agent_visual:
        profiles: [ "agent-visual" ]
        build:
            context: .
            dockerfile: docker/hermes/Dockerfile
        image: pricebuddy-hermes:latest
        shm_size: "1gb"
        # Temporário: permite que localhost no .env alcance o OmniRoute no host.
        # Substituir por uma rede privada com o serviço omniroute no Compose.
        extra_hosts:
            - "host.docker.internal:host-gateway"
        environment:
            PRICEBUDDY_API_BASE_URL: http://app/api
            PRICEBUDDY_API_TOKEN: ${PRICEBUDDY_API_TOKEN:-}
            HERMES_STORE_ID: ${HERMES_STORE_ID:-}
            HERMES_MIN_DISCOUNT_PERCENTAGE: ${HERMES_MIN_DISCOUNT_PERCENTAGE:-20}
            HERMES_ALLOWED_HOSTS: ${HERMES_ALLOWED_HOSTS:-}
            HERMES_HTTP_PROXY: ${HERMES_HTTP_PROXY:-}
            HERMES_DEFAULT_TAG: ${HERMES_DEFAULT_TAG:-}
            HERMES_LLM_BASE_URL: ${HERMES_LLM_BASE_URL:-}
            HERMES_LLM_API_KEY: ${HERMES_LLM_API_KEY:-}
            HERMES_LLM_MODEL: ${HERMES_LLM_MODEL:-}
            HERMES_LLM_ENABLE_THINKING: ${HERMES_LLM_ENABLE_THINKING:-true}
            HERMES_LLM_REQUEST_TIMEOUT_SECONDS: ${HERMES_LLM_REQUEST_TIMEOUT_SECONDS:-120}
            HERMES_LLM_MAX_OUTPUT_TOKENS: ${HERMES_LLM_MAX_OUTPUT_TOKENS:-4096}
            HERMES_LLM_PAGE_SEGMENT_CHARS: ${HERMES_LLM_PAGE_SEGMENT_CHARS:-12000}
            HERMES_MAX_PAGES: ${HERMES_MAX_PAGES:-15}
            HERMES_MIN_PRODUCTS: ${HERMES_MIN_PRODUCTS:-10}
            HERMES_RUN_TIMEOUT_SECONDS: ${HERMES_RUN_TIMEOUT_SECONDS:-600}
            HERMES_2CAPTCHA_API_KEY: ${HERMES_2CAPTCHA_API_KEY:-}
            HERMES_2CAPTCHA_PROXY: ${HERMES_2CAPTCHA_PROXY:-}
            HERMES_2CAPTCHA_TIMEOUT: ${HERMES_2CAPTCHA_TIMEOUT:-180}
            HERMES_2CAPTCHA_MAX_RETRIES: ${HERMES_2CAPTCHA_MAX_RETRIES:-2}
        depends_on:
            app:
                condition: service_started
        volumes:
            - hermes_firefox_profile:/home/hermes/.mozilla/firefox/pricebuddy-hermes
        networks:
            - hermes_app
        ports:
            - "127.0.0.1:7900:7900"
        stdin_open: true
        tty: true
        entrypoint: [ "bash", "/opt/hermes/run-agent.sh" ]

    # Renders the video carousel of the publication modal (Remotion). Self-contained:
    # Laravel talks to it only over HTTP (VIDEO_URL).
    video:
        build:
            context: .
            dockerfile: video/Dockerfile
        image: pricebuddy-video:latest
        restart: unless-stopped
        shm_size: "1gb"
        environment:
            VIDEO_RENDER_CONCURRENCY: ${VIDEO_RENDER_CONCURRENCY:-2}
            TZ: America/Sao_Paulo
        volumes:
            - video_data:/data
        networks:
            - hermes_app
        expose:
            - 8200

    # Remotion Studio to edit the carousel layout live: docker compose --profile studio up video_studio
    video_studio:
        profiles: [ "studio" ]
        image: pricebuddy-video:latest
        working_dir: /opt/video/remotion
        command: [ "npx", "remotion", "studio", "src/index.ts", "--port=3001", "--no-open" ]
        volumes:
            - ./video/remotion/src:/opt/video/remotion/src
        ports:
            - "127.0.0.1:3001:3001"
volumes:
    storage:
    database:
    hermes_firefox_profile:
    intelligence_data:
    video_data:

networks:
    default:
    hermes_app:
